services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetintel}
      POSTGRES_USER: ${POSTGRES_USER:-fleetintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetintel_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleetintel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-fleetintel}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-fleetintel_local_only}
      IDLE_ALERT_SECONDS: ${IDLE_ALERT_SECONDS:-300}
      FUEL_LITRES_PER_IDLE_HOUR: ${FUEL_LITRES_PER_IDLE_HOUR:-1.5}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./frontend
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres-data:
