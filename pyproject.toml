[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Synthetic connected-vehicle idling and fuel-waste MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
