[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet-intelligence-simulator"
version = "0.1.0"
description = "Synthetic connected-vehicle data generator for the Fleet Intelligence Platform"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fleetintel-sim = "fleetpulse.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
